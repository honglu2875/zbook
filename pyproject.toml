[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zbook"
version = "1.0.0rc1"
description = "A fast, keyboard-first Jupyter notebook with uv and Codex CLI integration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "honglu2875" }]
keywords = ["jupyter", "notebook", "ipython", "uv", "codex", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "jupyter-server>=2.15,<3",
  "nbformat>=5.10,<6",
  "traitlets>=5.14,<6",
]

[project.urls]
Homepage = "https://github.com/honglu2875/zbook"
Repository = "https://github.com/honglu2875/zbook"
Issues = "https://github.com/honglu2875/zbook/issues"
Changelog = "https://github.com/honglu2875/zbook/blob/main/CHANGELOG.md"
Support = "https://github.com/honglu2875/zbook/blob/main/SUPPORT.md"

[project.scripts]
zbook = "zbook.cli:main"

[dependency-groups]
dev = [
  "ipykernel>=6.29,<8",
  "ipympl>=0.10,<0.11",
  "ipywidgets>=8.1,<9",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zbook"]

[tool.hatch.build.targets.sdist]
exclude = ["/frontend/node_modules"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
